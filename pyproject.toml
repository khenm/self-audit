[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-template-code"
version = "0.1.0"
description = "A clean generic PyTorch template for research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy>=1.26.4",
    "torchvision",
    "torchaudio",
    "tqdm",
    "pandas",
    "pyyaml",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "fvcore",
    "wcmatch",
    "tensorboard",
    "iopath",
    "monai[all]>=1.4.0",
    "opencv-python-headless",
    "einops",
    "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.0/causal_conv1d-1.6.0+cu13torch26.01cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
    "mamba-ssm @ https://github.com/state-spaces/mamba/releases/download/v2.3.0/mamba_ssm-2.3.0+cu13torch26.01cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
