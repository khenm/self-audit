defaults:
  - dataset@data: echonet
  - model: cardiac_mamba
  - loss: calibration_loss
  - _self_

exp_name: calibrate_volume_003
seed_value: 42
max_epochs: 20
accum_steps: 1
val_epoch_freq: 1
limit_train_batches: null
limit_val_batches: null
num_workers: 4
batch_size: 64

optim:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 3e-4
    weight_decay: 0.0

  frozen_module_names:
    - encoder
    - decoder
    - temporal_adapter
    - temporal_mamba
    - phase_head

  reinit_module_names:
    - volume_derivation

  amp:
    enabled: true
    amp_dtype: bfloat16

  gradient_clip:
    _target_: src.utils.gradient_clip.GradientClipper
    configs: []

  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 3e-4
          end_value: 3e-6
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0

logging:
  log_dir: /workspace/logs/${exp_name}
  log_freq: 10
  log_level_primary: INFO
  log_level_secondary: WARNING
  all_ranks: false
  tensorboard_writer:
    _target_: src.utils.tensorboard_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss
        - loss_vol
        - loss_ef
    val:
      keys_to_log:
        - loss
        - loss_vol
        - loss_ef

checkpoint:
  save_dir: /workspace/logs/${exp_name}/ckpts
  save_freq: 2
  # Point this at the Phase 1 pretrain checkpoint before running
  resume_checkpoint_path: null
  strict: false

distributed:
  strategy: ddp
  backend: nccl
  find_unused_parameters: false
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: true
  timeout_mins: 30
  fsdp:
    sharding_strategy: FULL_SHARD
    cpu_offload: false
    min_num_params: 100000

cuda:
  cudnn_deterministic: false
  cudnn_benchmark: false
  allow_tf32: true
