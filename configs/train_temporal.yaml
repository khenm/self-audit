defaults:
  - dataset@data: echonet
  - model: cardiac_mamba
  - loss: finetune_loss
  - _self_

exp_name: train_temporal_001
seed_value: 42
max_epochs: 50
accum_steps: 4
val_epoch_freq: 2
limit_train_batches: null
limit_val_batches: null
num_workers: 12
batch_size: 16

optim:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 1e-4

  frozen_module_names:
    - encoder
    - decoder

  amp:
    enabled: true
    amp_dtype: bfloat16

  gradient_clip:
    _target_: src.utils.gradient_clip.GradientClipper
    configs: []

  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 1e-4
          end_value: 1e-6
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 1e-4

logging:
  log_dir: /workspace/logs/${exp_name}
  log_freq: 10
  log_level_primary: INFO
  log_level_secondary: WARNING
  all_ranks: false
  tensorboard_writer:
    _target_: src.utils.tensorboard_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss
        - loss_mask
        - loss_vol
        - loss_ef
        - loss_phase
        - loss_curv
        - loss_phase_smooth
    val:
      keys_to_log:
        - loss
        - loss_mask
        - loss_vol
        - loss_ef
        - loss_phase
        - loss_curv
        - loss_phase_smooth

checkpoint:
  save_dir: /workspace/logs/${exp_name}/ckpts
  save_freq: 5
  # Resume from Phase 1b calibration checkpoint
  resume_checkpoint_path: null
  strict: false

distributed:
  strategy: ddp
  backend: nccl
  find_unused_parameters: false
  gradient_as_bucket_view: true
  bucket_cap_mb: 25
  broadcast_buffers: true
  timeout_mins: 30
  fsdp:
    sharding_strategy: FULL_SHARD
    cpu_offload: false
    min_num_params: 100000

cuda:
  cudnn_deterministic: false
  cudnn_benchmark: false
  allow_tf32: true
